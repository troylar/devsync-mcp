[build-system]
requires = ["setuptools<69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devsync-mcp"
version = "0.1.0"
description = "MCP server for AI-merge of team dev configurations"
readme = "README.md"
authors = [{ name = "Troy Larson", email = "troy@calvinware.com" }]
requires-python = ">=3.10"
license = { text = "MIT License" }
keywords = ["mcp", "ai", "config", "merge", "devsync", "team", "sync"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "devsync>=0.10.0",
    "fastmcp>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "black==24.10.0",
    "mypy>=1.10.0",
    "ruff>=0.9.0",
    "types-PyYAML>=6.0.12.20240808",
]

[project.scripts]
devsync-mcp = "devsync_mcp.server:main"

[project.urls]
Homepage = "https://github.com/troylar/devsync-mcp"
Documentation = "https://devsync.readthedocs.io/en/latest/mcp-server/"
Repository = "https://github.com/troylar/devsync-mcp"
Issues = "https://github.com/troylar/devsync-mcp/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=devsync_mcp --cov-report=term-missing -p no:cacheprovider"

[tool.coverage.run]
relative_files = true
source = ["devsync_mcp"]

[tool.black]
line-length = 120
target-version = ["py310", "py311", "py312", "py313"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["devsync.*"]
ignore_missing_imports = true
